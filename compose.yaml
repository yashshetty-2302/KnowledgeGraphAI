version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowledgegraph-backend
    ports:
      - "8000:8000"
    environment:
      - ./backend/.env
    volumes:
      - backend-data:/app/data
    networks:
      - knowledgegraph-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledgegraph-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - knowledgegraph-network

volumes:
  backend-data:
    driver: local

networks:
  knowledgegraph-network:
    driver: bridge
